name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Catalog drift gate: tools/list bytes are a reviewed artifact (.mcp-catalog/).
      # Re-snapshot deliberately with `npm run catalog:snapshot` and commit the diff.
      - run: npm run catalog:check
