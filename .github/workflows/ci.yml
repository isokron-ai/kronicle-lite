name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Catalog drift gate: tools/list bytes are a reviewed artifact (.mcp-catalog/).
      # Re-snapshot deliberately with `npm run catalog:snapshot` and commit the diff.
      - run: npm run catalog:check

  # Differential: the evidence pack's RFC 3161 tokens (anchors and SHA256SUMS) against
  # `openssl ts -verify`, every raw command in VERIFY.md (openssl, jq, shasum, xxd) and
  # ssh-keygen -Y sign / verify for the human sign-off. Skipped when the runner has no
  # OpenSSL 3+; with it, KL_REQUIRE_RAW_TOOLS=1 makes a missing tool fail instead of skip.
  openssl-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: tools
        run: |
          if openssl version | grep -Eq '^OpenSSL [3-9]\.'; then echo "openssl=yes" >> "$GITHUB_OUTPUT"; else echo "openssl=no" >> "$GITHUB_OUTPUT"; echo "no OpenSSL 3+ on this runner: skipping"; fi
          openssl version || true
      - if: steps.tools.outputs.openssl == 'yes'
        run: npm ci
      - if: steps.tools.outputs.openssl == 'yes'
        run: npm run build
      - if: steps.tools.outputs.openssl == 'yes'
        run: "npx vitest run test/verify-audit-profile.test.ts -t 'openssl differential|differential: ssh-keygen'"
        env:
          KL_REQUIRE_RAW_TOOLS: '1'

  # The standalone verifier (packages/verify): verify.mjs against kronicle-lite verify-audit on every
  # pack format and the published sample pack (differential), the shims against the packages they
  # replace, the package contents and a byte-identical rebuild. Node 22 is its minimum.
  verify-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:test
      - name: The single file rebuilds byte for byte
        run: |
          cp packages/verify/dist/verify.mjs /tmp/verify.first.mjs
          node packages/verify/build.mjs
          cmp /tmp/verify.first.mjs packages/verify/dist/verify.mjs
          sha256sum packages/verify/dist/verify.mjs

  # verify.mjs on Windows and macOS: the published sample pack, as a buyer runs it.
  verify-package-smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:build
      - name: The sample pack is PARTIAL under --profile legacy (exit 2), and one flipped byte fails it (exit 1)
        shell: bash
        run: |
          P=packages/verify/test/fixtures/isokron-sample-evidence-pack
          FP=d70b311bf6e25c0c20ec3b4645f806f28b8712e212142720eeb51d2c6fa5072b
          set +e
          node packages/verify/dist/verify.mjs "$P" --key-fingerprint "$FP" --profile legacy --data-dir "$RUNNER_TEMP/kl-a"
          [ $? -eq 2 ] || exit 1
          cp -R "$P" "$RUNNER_TEMP/tampered"
          printf 'x' >> "$RUNNER_TEMP/tampered/claims.json"
          node packages/verify/dist/verify.mjs "$RUNNER_TEMP/tampered" --key-fingerprint "$FP" --profile legacy --data-dir "$RUNNER_TEMP/kl-b"
          [ $? -eq 1 ] || exit 1

  # macOS: no GNU `timeout` (the shim falls back to perl alarm, exit 142),
  # /var -> /private/var symlinks, bash 3.2 as /bin/sh's sibling.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Windows: paths, file modes (0600 is a no-op; POSIX-only assertions are
  # skipped there with a reason), fs.watch, git and stdio/HTTP transports.
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run catalog:check
