# Release the standalone Evidence Pack verifier (packages/verify) to npm with trusted publishing
# (OIDC) and provenance, and attach the single-file build (verify.mjs) to a GitHub release with a
# build-provenance attestation.
#
# The package name is packages/verify/package.json "name" (@isokron/verify unless the owner changes
# it); the workflow reads it from there.
#
# NOTHING RUNS until the owner has set up the npm side and then set the repository variable
# VERIFY_NPM_TRUSTED_PUBLISHER to "configured" (Settings → Secrets and variables → Actions →
# Variables). Every job checks it. The exact npm and GitHub settings are in packages/verify/README.md
# ("Publishing"):
#   npm trusted publisher: organization isokron-ai, repository kronicle-lite,
#                          workflow release-verify.yml, environment npm-publish-verify
#
# Jobs:
#   build           no token of any kind: installs, lints, tests (the differential against
#                   kronicle-lite verify-audit), builds verify.mjs, packs the tarball, and hands both
#                   on as an artifact. Dependency install scripts run only here.
#   publish         tag pushes only, behind the npm-publish-verify environment: checks the artifact
#                   is what build packed, attests verify.mjs, publishes the tarball with provenance.
#                   It installs no dependencies, so no package code runs while it holds the OIDC token.
#   github-release  tag pushes only: the release for the tag, with verify.mjs and its SHA-256.
#
# Triggers:
#   - push of a tag verify/vX.Y.Z (X.Y.Z = packages/verify/package.json version); kronicle-lite's own
#     release.yml (tags vX.Y.Z) does not match it, and this workflow does not match those;
#   - workflow_dispatch: a dry run (the build job only; nothing is published or released).
name: release-verify

on:
  push:
    tags: ['verify/v*.*.*']
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.VERIFY_NPM_TRUSTED_PUBLISHER == 'configured'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      file: ${{ steps.pack.outputs.file }}
      version: ${{ steps.pack.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Tag and packages/verify/package.json agree
        if: github.event_name == 'push'
        run: node packages/verify/scripts/release-check.mjs tag "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Builds kronicle-lite and verify.mjs, then the differential, shim and package tests on that file.
      - run: npm run verify:test
      - name: Pack the tested verify.mjs and record the integrity
        id: pack
        working-directory: packages/verify
        run: |
          npm pack --json > pack.json
          node scripts/release-check.mjs pack pack.json >> "$GITHUB_OUTPUT"
      - name: npm publish --dry-run
        working-directory: packages/verify
        env:
          PKG_FILE: ${{ steps.pack.outputs.file }}
          PKG_NAME: ${{ steps.pack.outputs.name }}
          PKG_VERSION: ${{ steps.pack.outputs.version }}
          PKG_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          FILE_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          npm publish "$PKG_FILE" --dry-run --access public
          {
            echo "### $PKG_NAME $PKG_VERSION: built, tested and packed"
            echo ""
            echo "- tarball: \`$PKG_FILE\` (integrity \`$PKG_INTEGRITY\`)"
            echo "- verify.mjs sha256: \`$FILE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the tarball and verify.mjs to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            packages/verify/${{ steps.pack.outputs.file }}
            packages/verify/dist/verify.mjs
          if-no-files-found: error

  publish:
    needs: build
    if: vars.VERIFY_NPM_TRUSTED_PUBLISHER == 'configured' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/verify/v')
    runs-on: ubuntu-latest
    # The approval gate. Its name must match the environment set on the npm trusted publisher.
    environment: npm-publish-verify
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for a one-time publish credential,
      # and the same token signs the npm provenance statement and the verify.mjs attestation.
      id-token: write
      attestations: write
    steps:
      # Only for packages/verify/package.json and scripts/release-check.mjs (no dependencies, no install).
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: npm with trusted publishing support
        run: |
          npm install -g --ignore-scripts npm@11.6.2
          node packages/verify/scripts/release-check.mjs npm "$(npm --version)"
      - name: Tag and packages/verify/package.json agree
        run: node packages/verify/scripts/release-check.mjs tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The artifact is what the build job tested and packed
        env:
          PKG_FILE: ${{ needs.build.outputs.file }}
          PKG_INTEGRITY: ${{ needs.build.outputs.integrity }}
          FILE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$FILE_SHA256  release/dist/verify.mjs" | sha256sum -c -
          got="sha512-$(openssl dgst -sha512 -binary "release/$PKG_FILE" | base64 -w0)"
          [ "$got" = "$PKG_INTEGRITY" ] || { echo "tarball integrity $got, build packed $PKG_INTEGRITY"; exit 1; }
      - name: Attest verify.mjs (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/dist/verify.mjs
      - name: Publish with provenance (trusted publishing)
        # No token: an NPM_TOKEN / NODE_AUTH_TOKEN here would bypass trusted publishing.
        env:
          PKG_FILE: ${{ needs.build.outputs.file }}
        run: npm publish "./release/$PKG_FILE" --provenance --access public
      - name: The registry serves what was packed, with provenance
        env:
          PKG_NAME: ${{ needs.build.outputs.name }}
          PKG_VERSION: ${{ needs.build.outputs.version }}
          PKG_INTEGRITY: ${{ needs.build.outputs.integrity }}
          FILE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node packages/verify/scripts/release-check.mjs registry "$PKG_VERSION" "$PKG_INTEGRITY"
          {
            echo "### $PKG_NAME $PKG_VERSION published with provenance"
            echo ""
            echo "- npm integrity: \`$PKG_INTEGRITY\`"
            echo "- verify.mjs sha256 (publish this on the verify page): \`$FILE_SHA256\`"
            echo "- check: \`npm view $PKG_NAME@$PKG_VERSION dist.integrity dist.attestations\`, \`gh attestation verify verify.mjs --repo isokron-ai/kronicle-lite\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The single file, on the GitHub release for the tag: what a buyer downloads, reads and runs.
  github-release:
    needs: [build, publish]
    if: vars.VERIFY_NPM_TRUSTED_PUBLISHER == 'configured' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/verify/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release with verify.mjs and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          FILE_SHA256: ${{ needs.build.outputs.sha256 }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          cd release/dist
          echo "$FILE_SHA256  verify.mjs" | sha256sum -c -
          echo "$FILE_SHA256  verify.mjs" > verify.mjs.sha256
          {
            echo "Standalone Evidence Pack verifier $VERSION: one file, Node.js 22+, no dependencies."
            echo ""
            echo '```sh'
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/verify.mjs"
            echo "echo '$FILE_SHA256  verify.mjs' | shasum -a 256 -c -"
            echo "gh attestation verify verify.mjs --repo $GITHUB_REPOSITORY   # optional: built by this workflow from this tag"
            echo "node verify.mjs PACK --key-fingerprint <from your statement of work>"
            echo '```'
            echo ""
            echo "- verify.mjs sha256: \`$FILE_SHA256\`"
            echo "- npm: integrity \`$INTEGRITY\`"
          } > notes.md
          gh release create "$TAG" verify.mjs verify.mjs.sha256 --repo "$GITHUB_REPOSITORY" --title "verify $VERSION" --notes-file notes.md --verify-tag
